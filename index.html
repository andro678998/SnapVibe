    <!-- Main Content Area (Pictures Section Separated Below) -->

            <a href="https://whatsapp.com/channel/0029VbE1QLa42Dcbsb0wLl03" target="_blank" class="text-emerald-400 hover:text-emerald-300 transition"><i class="fa-brands fa-whatsapp"></i></a>

        </div>
        <p>&copy; 2026 SnapVibe_official. All rights reserved. Synced automatically via GitHub.</p>
    </footer>

    <!-- JavaScript GitHub Auto-Sync Logic -->
    <script>
        // ضع هنا اسم حسابك واسم المشروع على جيت هب
        const GITHUB_USER = "YOUR_GITHUB_USERNAME";
        const REPO_NAME = "YOUR_REPO_NAME";
        const FOLDER_PATH = "images";

        document.addEventListener("DOMContentLoaded", () => {
            fetchGitHubImages();
        });

        async function fetchGitHubImages() {
            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${FOLDER_PATH}`;
            
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("Failed to fetch from GitHub repository");
                
                const files = await response.json();
                
                // تصفية الملفات لجلب الصور فقط واستثناء صور الباننر واللوجو لكي لا تظهر ضمن الشبكة العامة
                const imageFiles = files.filter(file => 
                    file.type === "file" && 
                    /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name) &&
                    file.name.toLowerCase() !== "banner.jpg" &&
                    file.name.toLowerCase() !== "logo.jpg"
                );

                const pictures = imageFiles.map(file => ({
                    title: file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " "),
                    url: file.download_url
                }));

                renderPictures(pictures);

            } catch (error) {
                console.error("Error loading images:", error);
                document.getElementById("picturesGrid").innerHTML = `
                    <div class="col-span-full text-center py-16 text-zinc-500 text-sm">
                        Please update GITHUB_USER and REPO_NAME in the script to match your repository.
                    </div>`;
            }
        }

        function renderPictures(list) {
            const grid = document.getElementById("picturesGrid");
            document.getElementById("countBadge").innerText = list.length;
            grid.innerHTML = "";

            if(list.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-zinc-500 text-sm">No pictures found in the 'images' folder on GitHub.</div>`;
                return;
            }

            list.forEach(item => {
                const card = `
                    <div class="bg-cardBg border border-borderColor rounded-2xl overflow-hidden group shadow-lg hover:border-amber-400 transition duration-300 flex flex-col justify-between">
                        <div class="h-48 w-full overflow-hidden relative">
                            <img src="${item.url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="${item.title}">
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition duration-300 flex items-center justify-center gap-3">
                                <a href="${item.url}" target="_blank" class="bg-amber-500 hover:bg-amber-600 text-zinc-950 px-4 py-2 rounded-xl text-xs font-bold transition shadow-lg flex items-center gap-1.5">
                                    <i class="fa-solid fa-download"></i> Download
                                </a>
                            </div>
                        </div>
                        <div class="p-4 flex items-center justify-between">
                            <h3 class="font-bold text-sm text-white truncate capitalize">${item.title}</h3>
                            <a href="https://whatsapp.com/channel/0029VbE1QLa42Dcbsb0wLl03" target="_blank" class="text-emerald-400 text-xs hover:underline flex items-center gap-1">
                                <i class="fa-brands fa-whatsapp"></i> Channel
                            </a>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }
    </script>
